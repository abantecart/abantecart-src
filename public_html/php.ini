;Use this file for specific PHP settings on your server required for AbanteCart.

output_buffering = 4096;
magic_quotes_gpc = Off;
register_globals = Off;
default_charset	= UTF-8;
memory_limit = 128M;
max_execution_time = 18000;
upload_max_filesize = 100M;
safe_mode = Off;
mysql.connect_timeout = 20;
session.use_cookies = On;
session.use_trans_sid = Off;
session.gc_maxlifetime = 12000000;
apc.enabled = 0;

;disable dangerous functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,pcntl_fork,pcntl_signal,pcntl_waitpid,pcntl_wexitstatus,pcntl_alarm,posix_kill,posix_setuid,posix_setgid,posix_setsid,posix_setpgid,posix_mkfifo,posix_getpwuid,posix_uname
